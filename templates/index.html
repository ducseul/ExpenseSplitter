<!DOCTYPE html>
<html>
<head>
    <title>Travel Expense Splitter - Add Participants</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h2>Step 1: Add Participants</h2>
    <form id="participantForm" method="POST" action="/participants">
        <div id="participantInputs">
            <div class="mb-3 d-flex align-items-center participant-row">
                <input type="text" name="participants[]" class="form-control me-2" placeholder="Participant name" required>
                <button type="button" class="btn btn-danger btn-sm remove-btn">Remove</button>
            </div>
        </div>
        <button type="button" class="btn btn-secondary" onclick="addParticipantField()">Add More</button>
        <button type="submit" class="btn btn-primary">Next</button>
    </form>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
function addParticipantField() {
    $('#participantInputs').append(`
        <div class="mb-3 d-flex align-items-center participant-row">
            <input type="text" name="participants[]" class="form-control me-2" placeholder="Participant name" required>
            <button type="button" class="btn btn-danger btn-sm remove-btn">Remove</button>
        </div>
    `);
}

$(document).on('click', '.remove-btn', function() {
    $(this).closest('.participant-row').remove();
});
</script>
</body>
</html>
